name: AI News Aggregator

on:
  # Cron er ALTID UTC. Vi vil køre kl. 12 og 22 dansk tid, men Danmark skifter
  # mellem UTC+2 (sommer) og UTC+1 (vinter). Derfor vækkes workflowet på begge
  # mulige UTC-tidspunkter, og pipelinen afgør selv ud fra schedule.run_hours
  # i config.yaml, om det er den rigtige lokale time — resten afsluttes straks.
  #   10:00 UTC = 12:00 sommertid | 11:00 UTC = 12:00 vintertid
  #   20:00 UTC = 22:00 sommertid | 21:00 UTC = 22:00 vintertid
  schedule:
    - cron: "0 10,11,20,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (udskriv i stedet for at sende)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Databasen gemmes mellem kørsler via Actions cache. restore-keys uden
      # run_id matcher den nyeste tidligere kørsel.
      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
          restore-keys: |
            ai-news-db-

      # Manuel start kører altid (--force); planlagte kørsler respekterer
      # schedule.run_hours, så de to "forkerte" UTC-vækninger afsluttes straks.
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sæt kun secrets for den kanal du bruger — resten kan stå tomme.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m ai_news run \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Save database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
