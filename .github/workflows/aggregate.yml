name: AI News Aggregator

on:
  # Vækkes hver time. Pipelinen afgør selv, om et af de planlagte tidspunkter
  # i schedule.run_hours (config.yaml, lokal tid) er passeret uden at være
  # betjent — ellers afsluttes den straks uden at hente noget.
  #
  # Hvorfor hver time og ikke kun på de fire tidspunkter: GitHubs cron er
  # "best effort" og dropper jævnligt kørsler helt ved travlhed. Rammer vi kun
  # præcise klokkeslæt, betyder én droppet kørsel ingen nyheder den dag. Med
  # timevis vækning og fangst-op hentes en misset kørsel ind af den næste.
  # Det håndterer også sommertid uden særlige UTC-timer.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (udskriv i loggen i stedet for at sende)"
        type: boolean
        default: false
      reset:
        description: "Nulstil sende-historik først (frigør dagens kvote)"
        type: boolean
        default: false
      rescore:
        description: "Score og kategorisér alt forfra med LLM'en (bruger flere API-kald)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Databasen gemmes mellem kørsler via Actions cache. restore-keys uden
      # run_id matcher den nyeste tidligere kørsel.
      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
          restore-keys: |
            ai-news-db-

      # Manuel start kører altid (--force); planlagte kørsler respekterer
      # schedule.run_hours, så de to "forkerte" UTC-vækninger afsluttes straks.
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Valgfri: officielt X API (betalt). Uden denne bruges gratis nitter.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Sæt kun secrets for den kanal du bruger — resten kan stå tomme.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.rescore }}" = "true" ]; then
            python -m ai_news reset --scores
          elif [ "${{ inputs.reset }}" = "true" ]; then
            python -m ai_news reset
          fi
          python -m ai_news run \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Save database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
