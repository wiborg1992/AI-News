name: AI News Aggregator

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (udskriv i stedet for at sende)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Databasen gemmes mellem kørsler via Actions cache. restore-keys uden
      # run_id matcher den nyeste tidligere kørsel.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
          restore-keys: |
            ai-news-db-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m ai_news run ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/ai_news.db
          key: ai-news-db-${{ github.run_id }}
