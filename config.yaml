# AI-News konfiguration
# Secrets sættes som miljøvariabler / GitHub Actions Secrets — aldrig her.

timezone: Europe/Copenhagen
language: da

schedule:
  # Lokale timer hvor pipelinen rent faktisk kører. GitHub Actions cron er
  # altid UTC, så workflowet vækkes på begge mulige UTC-tidspunkter (sommer-
  # og vintertid) og kører kun videre, hvis den lokale time står her.
  # Tom liste = kør uanset tidspunkt.
  run_hours: [8, 12, 17, 22]

notifications:
  # auto = brug den første kanal der har sine secrets sat
  # (rækkefølge: ntfy -> telegram -> pushover -> discord)
  # Sæt eksplicit til: ntfy | telegram | pushover | discord | console
  channel: auto
  # true = én samlet besked med alle historier fra kørslen.
  # false = én besked pr. historie.
  digest: true
  ntfy:
    server: https://ntfy.sh
    # topic sættes via NTFY_TOPIC — emnenavnet er reelt din adgangsnøgle
    # på det offentlige ntfy.sh, så det hører ikke hjemme i repoet.
    # Kør: python -m ai_news ntfy-setup

thresholds:
  notify_score: 7      # minimum samlet score (0-10) før der sendes notifikation
  breaking_score: 10   # sendes selv i stilleperioden

limits:
  max_notifications_per_day: 10
  cluster_window_hours: 72     # hvor langt tilbage der ledes efter matchende klynger
  max_article_age_hours: 48    # ældre artikler ignoreres ved ingestion
  max_notify_age_hours: 48     # klynger ældre end dette notificeres ikke
  title_match_threshold: 87    # rapidfuzz-tærskel for at to titler er samme historie

quiet_hours:      # lokal tid; breaking (score >= breaking_score) sendes alligevel
  start: 23
  end: 7

llm:
  scoring_model: claude-haiku-4-5
  summary_model: claude-sonnet-5
  # USD pr. million tokens. Bruges KUN til omkostningsestimatet i loggen —
  # den rigtige regning er den, Anthropic sender. Tjek priserne på
  # platform.claude.com/docs/en/pricing hvis estimatet ser forkert ud.
  # Bemærk: Sonnet 5 har intropris ($2/$10) frem til 2026-08-31, derefter $3/$15.
  prices:
    claude-haiku-4-5:
      input: 1.00
      output: 5.00
    claude-sonnet-5:
      input: 2.00
      output: 10.00
  # Omtrentlig vekselkurs, kun til visning. Sæt til 0 for at skjule DKK.
  dkk_per_usd: 7.0

# Sortering: hvad der er værd at blive forstyrret af.
# Hver klynge kategoriseres af LLM'en, og kategorien afgør tærsklen.
filtering:
  # Det du udtrykkeligt bad om — får +1 i score, så de slipper lettere igennem.
  priority_categories: [model_launch, model_update, feature, open_source, pricing]
  priority_boost: 1

  # Sendes aldrig, uanset score: holdninger, rygter, listicles, tutorials, marketing.
  blocked_categories: [noise]

  # Tærskel pr. kategori (falder tilbage til thresholds.notify_score).
  # Lav tærskel = slipper let igennem. Høj tærskel = skal være stort.
  category_thresholds:
    model_launch: 5     # ny model — vil næsten altid vide det
    model_update: 5     # fx opdatering til Fable
    feature: 6          # nye funktioner og API-kapabiliteter
    open_source: 6
    pricing: 6
    security: 7
    infrastructure: 8
    regulation: 8
    business: 8         # opkøb/investeringer skal være store
    research: 9         # papers kun hvis de er banebrydende
    industry: 8         # anden IT-nyhed skal være væsentlig

feeds:
  # Førstehåndskilder (firma-blogs). Anthropic har ikke officiel RSS — dækkes via medier/HN.
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    type: first_party
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    type: first_party
  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    type: first_party
  - name: Microsoft AI
    url: https://news.microsoft.com/source/topics/ai/feed/
    type: first_party
  - name: Microsoft Azure Blog
    url: https://azure.microsoft.com/en-us/blog/feed/
    type: first_party
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    type: first_party
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    type: first_party

  # Tech-medier
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    type: media
  - name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    type: media
  - name: VentureBeat AI
    url: https://venturebeat.com/category/ai/feed/
    type: media
  - name: Ars Technica AI
    url: https://arstechnica.com/ai/feed/
    type: media
  - name: Wired AI
    url: https://www.wired.com/feed/tag/ai/latest/rss
    type: media
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    type: media

  # Kuraterede nyhedsbreve
  - name: TLDR AI
    url: https://tldr.tech/api/rss/ai
    type: newsletter

hackernews:
  enabled: true
  min_points: 100
  keywords:
    - AI
    - LLM
    - GPT
    - OpenAI
    - Anthropic
    - Claude
    - Gemini
    - DeepMind
    - Mistral
    - Llama
    - Copilot
    - Hugging Face
    - machine learning
    - chatbot

# Bemærk: Reddit blokerer ofte datacenter-IP'er (403). Fejlen håndteres som en
# advarsel, og resten af pipelinen kører videre. Slå fra hvis den fejler konstant.
reddit:
  enabled: true
  min_score: 200
  subreddits:
    - MachineLearning
    - LocalLLaMA
    - artificial

# X/Twitter — de mest toneangivende AI-stemmer.
# Hentes gratis via nitter-instanser (uofficielt; kan blive blokeret af X uden
# varsel — så logges en advarsel og resten af pipelinen kører videre).
# Sættes X_BEARER_TOKEN, bruges det officielle X API i stedet (betalt, stabilt).
x:
  enabled: true
  instances:
    - https://nitter.net
    - https://xcancel.com
  include_retweets: false
  min_length: 60        # korte opslag uden link/nøgleord filtreres fra
  accounts:
    # Officielle firmakonti
    - OpenAI
    - OpenAIDevs        # udvikler-/API-nyheder
    - AnthropicAI
    - GoogleDeepMind
    - GoogleAI
    - AIatMeta          # bemærk: @MetaAI findes ikke
    - MistralAI
    - huggingface
    - nvidia
    # Nøglepersoner
    - sama              # Sam Altman, OpenAI
    - gdb               # Greg Brockman, OpenAI
    - demishassabis     # Demis Hassabis, DeepMind
    - karpathy          # Andrej Karpathy
    - alexalbert__      # Alex Albert, Anthropic
    - ylecun            # Yann LeCun
    - _philschmid       # Philipp Schmid, Google DeepMind
    - swyx              # udvikler-perspektiv på AI
  keywords:             # opslag med disse ord slipper altid igennem forfilteret
    - launch
    - launching
    - introducing
    - announcing
    - available
    - release
    - released
    - open source
    - open weights
    - model
    - API
    - pricing
    - update

# Bluesky — gratis officielt API. Færre AI-folk end på X, men stabilt.
bluesky:
  enabled: true
  min_length: 60
  accounts:
    - simonwillison.net     # meget aktiv på LLM-værktøjer og modeludgivelser
    - emollick.bsky.social  # Ethan Mollick, AI i praksis
  keywords:
    - launch
    - introducing
    - announcing
    - release
    - released
    - open source
    - model
    - API
