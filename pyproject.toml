[project]
name = "ai-news"
version = "0.1.0"
description = "AI-nyhedsaggregator med krydstjek og push-notifikationer via Telegram"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-news = "ai_news.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
